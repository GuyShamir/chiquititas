<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>כניסה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--surface:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e4e2dc;--accent:#1f4e79;--accent-soft:#e8eef5;--warn:#9a5b00;--warn-soft:#fdf3e1;--done:#1e7a46;--done-soft:#e5f4ea;--work:#1f4e79;--work-soft:#e8eef5;--wait:#9a5b00;--wait-soft:#fdf3e1;--none:#6b6b70;--none-soft:#efeeea}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141416;--surface:#1d1d20;--ink:#ececee;--muted:#a0a0a8;--line:#2e2e33;--accent:#8db4dc;--accent-soft:#1f2a36;--warn:#f0b35a;--warn-soft:#2f2616;--done:#6fcf97;--done-soft:#17291f;--work:#8db4dc;--work-soft:#1f2a36;--wait:#f0b35a;--wait-soft:#2f2616;--none:#a0a0a8;--none-soft:#26262a}}
:root[data-theme="dark"]{--bg:#141416;--surface:#1d1d20;--ink:#ececee;--muted:#a0a0a8;--line:#2e2e33;--accent:#8db4dc;--accent-soft:#1f2a36;--warn:#f0b35a;--warn-soft:#2f2616;--done:#6fcf97;--done-soft:#17291f;--work:#8db4dc;--work-soft:#1f2a36;--wait:#f0b35a;--wait-soft:#2f2616;--none:#a0a0a8;--none-soft:#26262a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 64px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:360px;display:grid;gap:14px}
.login h1{font-size:22px;margin:0 0 4px}
.login label{display:grid;gap:6px;font-size:15px;color:var(--muted)}
.login input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.login button{font:inherit;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--accent);color:var(--surface);cursor:pointer}
.login button:disabled{opacity:.6;cursor:wait}
.err{color:#c0392b;font-size:14px;min-height:1.2em;margin:0}
.pw{position:relative}
.pw input{width:100%;padding-left:44px}
.login .eye{position:absolute;left:4px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:8px}
.login .eye:hover,.login .eye:focus-visible{color:var(--ink)}
.eye svg{width:20px;height:20px}
.remember{display:flex !important;align-items:center;gap:8px;font-size:15px;color:var(--ink) !important}
.remember input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.logout{display:flex;justify-content:flex-start;margin-bottom:8px}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
.side{position:sticky;top:24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.side-title{margin:0;font-weight:800;font-size:16px;padding:0 8px}
.menu{display:grid;gap:4px}
.menu a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.menu a:hover{background:var(--bg)}
.menu a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.soon{font-size:12px;color:var(--muted);font-weight:400}
#logout-slot .logout{margin:0;border-top:1px solid var(--line);padding-top:12px}
.main{min-width:0}
.main h2{margin-top:28px}
th small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.matrix table{min-width:980px}
.matrix th{color:var(--ink);font-weight:700;font-size:15px;background:var(--surface)}
.matrix td{font-size:15px;width:22%}
.matrix td.rank,.matrix th.rank{width:44px;min-width:44px;text-align:center;color:var(--muted);font-weight:700;white-space:nowrap;position:sticky;right:0;background:var(--surface)}
.matrix td:nth-child(2),.matrix th:nth-child(2){position:sticky;right:44px;background:var(--surface);width:16%;box-shadow:-1px 0 0 var(--line);font-weight:700}
.matrix td:first-child{white-space:nowrap}
.matrix td.open{color:var(--warn);font-weight:700;background:var(--warn-soft)}
.matrix td.done{color:var(--done);font-weight:700;background:var(--done-soft)}
.matrix td.work{color:var(--work);font-weight:700;background:var(--work-soft)}
bdi{white-space:nowrap}
.topic-tools{display:flex;gap:8px;margin:0 0 10px}
.topic-tools button{font:inherit;font-size:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:4px 14px;cursor:pointer}
.topics{display:grid;gap:8px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.topic summary{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;list-style:none}
.topic summary::-webkit-details-marker{display:none}
.topic summary::before{content:"";width:8px;height:8px;border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none;margin-top:-4px}
.topic[open] summary::before{transform:rotate(-45deg);margin-top:4px}
.topic summary:hover{background:var(--bg)}
.t-name{font-weight:700;flex:1}
.t-status{font-size:14px;font-weight:700;padding:3px 12px;border-radius:99px;text-align:center}
.t-status.open{color:var(--warn);background:var(--warn-soft)}
.t-status.done{color:var(--done);background:var(--done-soft)}
.t-status.work{color:var(--work);background:var(--work-soft)}
.t-dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.t-date{padding:14px 16px;font-size:15px}
.t-date+.t-date{border-right:1px solid var(--line)}
.t-date p{margin:0}
.t-when{font-weight:700;margin-bottom:6px !important}
.t-when small{font-weight:400;color:var(--muted);font-size:12px;margin-right:6px}
.t-date.empty{color:var(--muted)}
@media (max-width:700px){.t-dates{grid-template-columns:1fr}.t-date+.t-date{border-right:0;border-top:1px solid var(--line)}.t-date.empty{display:none}.topic summary{flex-wrap:wrap}.t-status{margin-right:20px}}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr);gap:16px}.side{position:static;padding:8px}.side-title{display:none}.menu{display:flex;flex-wrap:wrap}.menu a{flex:1 1 0;min-width:max-content;justify-content:center;flex-direction:column;gap:0;padding:8px}#logout-slot .logout{border:0;padding:0;justify-content:center}}
.logout button{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:4px 14px;cursor:pointer}
.logout button:hover{color:var(--ink)}
.hero{padding:8px 0 20px;border-bottom:1px solid var(--line);margin-bottom:28px}
.eyebrow{color:var(--accent);font-weight:700;font-size:14px;margin:0}
h1{font-size:30px;line-height:1.25;margin:6px 0;font-weight:800}
.meta{color:var(--muted);margin:0;font-size:15px}
section{margin:0 0 36px}
h2{font-size:22px;margin:0 0 14px}
h3{font-size:18px;margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.warn{border-color:var(--warn);background:var(--warn-soft)}
.card p{margin:0 0 8px}
.ask{font-weight:700;color:var(--accent)}
.card.warn .ask{color:var(--warn)}
.points{padding:0 20px 0 0;margin:0;display:grid;gap:10px}
.note{color:var(--muted);font-size:15px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:right;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;white-space:nowrap}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:14px;font-weight:500}
.tag.done{background:var(--done-soft);color:var(--done)}
.tag.work{background:var(--work-soft);color:var(--work)}
.tag.wait{background:var(--wait-soft);color:var(--wait)}
.tag.none{background:var(--none-soft);color:var(--none)}
@media (max-width:640px){h1{font-size:24px}body{font-size:16px}.tasks table{min-width:0}.tasks thead{display:none}.tasks table,.tasks tbody,.tasks tr,.tasks td{display:block;width:100%}.tasks tr{padding:12px 14px;border-bottom:1px solid var(--line)}.tasks tr:last-child{border-bottom:0}.tasks td{border:0;padding:2px 0}.tasks td:first-child{color:var(--muted);font-size:14px}.tasks td:last-child{padding-top:6px}.matrix table{min-width:760px}.matrix td,.matrix th{padding:9px 10px;font-size:14px}}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="f" autocomplete="on">
    <h1>כניסה</h1>
    <label>שם משתמש<input id="u" name="username" autocomplete="username" required></label>
    <label>סיסמה<span class="pw"><input id="p" name="password" type="password" autocomplete="current-password" required><button type="button" class="eye" id="eye" aria-label="הצג סיסמה" aria-pressed="false" title="הצג סיסמה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><line id="slash" x1="3" y1="3" x2="21" y2="21" style="display:none"/></svg></button></span></label>
    <label class="remember"><input type="checkbox" id="r" checked>לזכור אותי במכשיר הזה</label>
    <button id="b" type="submit">כניסה</button>
    <p class="err" id="e" role="alert"></p>
  </form>
</div>
<main class="wrap" id="content" hidden></main>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
// המפתח נשמר במכשיר כ-CryptoKey שאי אפשר לייצא (IndexedDB). הסיסמה עצמה לא נשמרת.
const DB='jd-client-update',ST='keys',ID='k-'+P.s;
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(ST);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
const kv=async(mode,fn)=>{const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(ST,mode),r=fn(t.objectStore(ST));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});};
const getKey=()=>kv('readonly',s=>s.get(ID)).catch(()=>null);
const putKey=k=>kv('readwrite',s=>s.put(k,ID)).catch(()=>{});
const clearKeys=()=>kv('readwrite',s=>s.clear()).catch(()=>{});
const open=async key=>{
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},key,d(P.c)));
  const m=document.getElementById('content');
  m.innerHTML=html;m.hidden=false;
  const lo='<div class="logout"><button type="button" id="out">התנתקות מהמכשיר הזה</button></div>';
  const slot=document.getElementById('logout-slot');if(slot)slot.innerHTML=lo;else m.insertAdjacentHTML('afterbegin',lo);
  const panels=[...m.querySelectorAll('[data-panel]')];
  if(panels.length){const show=()=>{const want=location.hash.slice(1);const cur=panels.find(p=>p.dataset.panel===want)||panels.find(p=>!p.hidden)||panels[0];panels.forEach(p=>p.hidden=p!==cur);m.querySelectorAll('[data-tab]').forEach(a=>a.dataset.tab===cur.dataset.panel?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));};window.addEventListener('hashchange',()=>{show();window.scrollTo(0,0);});show();}
  m.querySelectorAll('[data-open-frame]').forEach(b=>b.addEventListener('click',()=>{const f=document.getElementById(b.dataset.openFrame);if(f)window.open(URL.createObjectURL(new Blob([f.srcdoc],{type:'text/html'})),'_blank');}));
  m.querySelectorAll('[data-expand]').forEach(b=>b.addEventListener('click',()=>{const o=b.dataset.expand==='open';b.closest('[data-panel],main').querySelectorAll('details').forEach(x=>x.open=o);}));
  document.getElementById('login').remove();const tt=m.querySelector('[data-title]');document.title=tt?tt.dataset.title:'עדכון עבודה';
  document.getElementById('out').addEventListener('click',async()=>{await clearKeys();location.reload();});
};
(async()=>{
  try{const k=await getKey();if(k){await open(k);return;}}catch(_){await clearKeys();}
  document.getElementById('login').hidden=false;document.getElementById('u').focus();
})();
const eye=document.getElementById('eye'),pw=document.getElementById('p'),slash=document.getElementById('slash');
eye.addEventListener('click',()=>{const show=pw.type==='password';pw.type=show?'text':'password';eye.setAttribute('aria-pressed',show);const l=show?'הסתר סיסמה':'הצג סיסמה';eye.setAttribute('aria-label',l);eye.title=l;slash.style.display=show?'':'none';pw.focus();});
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=document.getElementById('b'),e=document.getElementById('e');
  b.disabled=true;e.textContent='';b.textContent='פותח...';
  try{
    const u=document.getElementById('u').value.trim().toLowerCase(),p=pw.value;
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(u+'\n'+p),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const remember=document.getElementById('r').checked;
    await open(key);
    if(remember)await putKey(key);
  }catch(_){e.textContent='שם המשתמש או הסיסמה לא נכונים';b.disabled=false;b.textContent='כניסה';}
});
</script>
